# cargo-deny configuration — https://embarkstudios.github.io/cargo-deny/
#
# Checked in CI (`rust-tests` job): `cargo deny check advisories bans licenses sources`
#
# Policy: every gate below is a RELEASE BLOCKER. An ignore entry is only
# acceptable when the advisory has no fix available AND the impact is
# documented below. Do not add an ignore to make a red build green without
# recording why the risk is acceptable.

[graph]
# Build the full feature graph, otherwise `tauri` feature-gated dependencies
# (which is where most of the crypto/TLS crates live) are not checked at all.
all-features = true

[output]
feature-depth = 1

[advisories]
version = 2
ignore = [
    # proc-macro-error is unmaintained (RUSTSEC-2024-0370). Transitive via
    # tauri 2.11 -> gtk 0.18 -> glib-macros; upstream has no safe upgrade
    # ("No safe upgrade is available!"). Revisit when the gtk-rs 0.19 /
    # tauri stack migrates away from proc-macro-error.
    "RUSTSEC-2024-0370",

    # `zip` 4.6.1 -- three advisories, one bug class: the archive extractor
    # trusts the archive's own permission and symlink metadata.
    #
    #   RUSTSEC-2026-0367  SUID/SGID bits survive extraction (GHSA-vv5m-jxxh-4627)
    #   RUSTSEC-2026-0368  symlink target may point outside the destination (GHSA-4v9h-p7m9-rh26)
    #   RUSTSEC-2026-0369  permissions applied through such a symlink (GHSA-4684-h2q9-2vcp)
    #
    # Why this is not upgraded away:
    #   - The fix is zip >= 9.0.0. tauri-plugin-updater pins `zip = "^4"`, and
    #     every published version of the plugin (2.14.0, and 3.0.0-alpha.3)
    #     still pins `^4`. Cargo cannot resolve a fixed zip without forking
    #     the plugin itself, so there is no upgrade path from here.
    #   - The `zip` feature cannot simply be switched off either. It is the
    #     plugin's default feature and it is what unpacks two of the update
    #     formats this project publishes: the compressed Linux AppImage and
    #     the Windows `.nsis.zip` bundle. With the feature disabled the plugin
    #     refuses compressed AppImage updates outright ("the update is a
    #     compressed AppImage, which can only be installed when the updater's
    #     `zip` feature is enabled").
    #
    # Why the impact is acceptable for THIS product:
    #   - 0367 needs the extracting process to be privileged. The desktop app
    #     is never installed or updated as root; a user session owns its own
    #     install directory.
    #   - 0368 and 0369 need an archive whose contents the attacker controls.
    #     The updater verifies the minisign signature of the download BEFORE
    #     it extracts anything (tauri-plugin-updater: `download_and_install`
    #     -> `verify` -> `extract`), so a tampered or unsigned archive never
    #     reaches the zip code. The archives are produced by our own release
    #     pipeline and signed there.
    #
    # Revisit when tauri-plugin-updater moves to zip 9: delete these three
    # entries, and let cargo deny fail until the lockfile carries zip >= 9.
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
]

# The `unic-*` family (open-i18n/rust-unic) used to be listed here as
# unmaintained but not vulnerable: RUSTSEC-2025-0075, -0080, -0081, -0098 and
# -0100. tauri-utils 2.10 moved to urlpattern 0.6, which dropped rust-unic
# from the tree altogether, so the crates left and the ignores became noise
# ("advisory was not encountered"). They were removed instead of left to rot:
# if a dependency bump ever brings rust-unic back, cargo deny has to fail on
# it again and be answered with a fresh, documented decision rather than
# inherited from a tree the crate is no longer part of.

# NOTE: RUSTSEC-2026-0285 (rustls TLS 1.3 encryption-level confusion) is NOT
# ignored — it has a fix, so it was resolved by upgrading the lockfile to
# rustls 0.23.45. If it reappears, upgrade; do not add it here.

[bans]
# Duplicate versions are expected in the tauri/gtk/wry tree and are not a
# security property. Warn so the list stays visible without failing the build.
multiple-versions = "warn"
# `foo = "*"` style requirements make a build non-reproducible in ways a
# lockfile bump cannot fully undo. None are present today.
wildcards = "deny"
# Nothing is hard-denied: the tauri stack has no safe alternative for these.
deny = []

[licenses]
version = 2
# Permissive licences only, plus MPL-2.0 (weak, file-level copyleft).
# Copyleft that would impose obligations on the distributed binary
# (GPL / AGPL / LGPL-only) is deliberately NOT allowed.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unlicense",
    "Unicode-3.0",
    "Zlib",
    # MPL-2.0: file-level copyleft, reached only through the Linux `wry`
    # chain (scraper/html5ever -> cssparser, selectors, dtoa-short,
    # option-ext). Used as an unmodified library; MPL-2.0 obliges us to
    # publish modifications to THOSE FILES, and we make none. A copyleft
    # licence here is a release-review item, not an automatic rejection.
    "MPL-2.0",
]
# A crate removed from the tree must not leave a stale allowance behind.
unused-allowed-license = "warn"

# Licences that are not valid SPDX expressions and therefore need an explicit
# interpretation. Pinned to the exact versions in Cargo.lock so the mapping is
# reproducible and gets re-reviewed on the next dependency bump.
[[licenses.clarify]]
name = "fnv"
version = "1.0.7"
expression = "Apache-2.0 OR MIT"
license-files = [{ path = "LICENSE-APACHE", hash = 0xbd0eed23 }, { path = "LICENSE-MIT", hash = 0xbd0eed23 }]

