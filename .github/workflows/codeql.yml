# CodeQL — SAST analysis (OpenSSF Scorecard SAST item)
# Runs security-extended query suite on push, PRs targeting main, and weekly.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Mondays 06:00 UTC — weekly scan
    - cron: "0 6 * * 1"

# Weekly and push triggers can overlap on the same commit, and two CodeQL runs
# uploading SARIF for one commit race each other's upload and one of them fails
# with a confusing "already exists" rather than saying what happened. Serialising
# per ref is the standard remedy; cancelling an in-progress push run would be
# wrong here because the older ref is the one that finished compiling.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  analyze-js:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: javascript-typescript
          # security-extended: broader security query suite beyond the default set
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: "/language:javascript-typescript"

  # src-tauri/src is ~14,200 lines of Rust and was outside every SAST scan:
  # cargo deny checks the dependency advisories, but nothing read the code for
  # the pattern bugs it can contain. credential_handler.rs is the Tauri IPC
  # boundary, which is where an unauthenticated command or a secret crossing the
  # process edge would live.
  #
  # Rust is analysed with build-mode: none -- CodeQL parses the sources directly
  # for Rust rather than instrumenting a cargo build, which is what keeps this
  # job at minutes instead of the ~30 the desktop build takes. It runs as its
  # own job because each language needs its own analyze category, and a single
  # job with two languages silently merges the two result sets.
  analyze-rust:
    name: Analyze (rust)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: rust
          build-mode: none
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: "/language:rust"