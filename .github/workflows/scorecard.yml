# OpenSSF Scorecard — supply-chain security self-assessment
# Results are published to the OSSF Scorecard API and uploaded to code scanning.
# https://github.com/ossf/scorecard-action
on:
  branch_protection_rule:
  schedule:
    # Tuesdays 05:40 UTC — weekly assessment
    - cron: "40 5 * * 2"
  push:
    branches: [main]
  workflow_dispatch:

# Weekly cron and a push to main can both fire for the same commit, and the
# scorecard action publishes to the OSSF API -- two runs racing that endpoint
# produce a failed run that looks like a supply-chain finding rather than a
# scheduling collision. Same reasoning as codeql.yml.
concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: false

# Declare read-only access upfront; jobs elevate their own scopes.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Needed to upload SARIF results to code scanning.
      security-events: write
      # Needed to publish results to the scorecard REST API (OIDC token).
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
