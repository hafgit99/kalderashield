# Publishes an explicitly unsigned Windows release, as a pre-release.
#
# Why this exists
# ---------------
# SignPath Foundation's terms require the project to have "already released the
# software in the form that should be signed" before an application is accepted.
# No Windows artifact had ever been published, so the application could not be
# made at all. This workflow produces that first Windows release.
#
# Why it is separate from release-desktop.yml
# -------------------------------------------
# That workflow's signing gate is a deliberate decision and it stays. A normal
# version tag still fails the job when an artifact is unsigned, and this workflow
# does not touch it, does not add an escape hatch to it, and cannot be triggered
# by a tag. Publishing an unsigned Windows installer as a normal release is
# exactly the thing the gate exists to prevent, so this file's whole purpose is to
# publish under different, visible terms instead of loosening those.
#
# The differences from a real release, all of them deliberate:
#
#   - manual only. No tag triggers this, so pushing a version tag cannot produce
#     an unsigned artifact as a side effect.
#   - marked `--prerelease`, so `latest` never points at it and the GitHub UI
#     shows it as provisional next to the three signed releases.
#   - the notes open with a warning that the files are unsigned and that Windows
#     will show "Windows protected your PC", above the changelog rather than in
#     it.
#   - the tag is suffixed `-unsigned-preview`, so the tag name alone tells anyone
#     reading a clone what they have.
#
# What to do when signing arrives
# -------------------------------
# Delete this workflow. The fail-closed gate in release-desktop.yml is the state
# this project is built for, and this file is the only reason it is ever stepped
# around.

name: Windows unsigned preview release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, e.g. 7.0.21. The tag becomes v<version>-unsigned-preview.'
        required: true
        type: string
      dry_run:
        description: 'Build and check everything, but do not create the release.'
        required: false
        default: true
        type: boolean

# Write access, deliberately. This is the one workflow in the repository that can
# create a release containing unsigned binaries, and it needs exactly that and
# nothing else -- no package write, no deployments, no id-token.
permissions:
  contents: write

concurrency:
  group: windows-unsigned-preview-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish unsigned Windows preview
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Refuse if release signing is now available
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERT_BASE64: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ($env:WINDOWS_SIGNING_CERT_BASE64 -or $env:TAURI_SIGNING_PRIVATE_KEY) {
            Write-Host '::error::Release signing is configured. An unsigned preview must not be published once a certificate exists -- delete this workflow and use the "Desktop release" workflow instead.'
            exit 1
          }

      - name: Validate version input
        shell: pwsh
        env:
          RAW: ${{ inputs.version }}
        run: |
          $v = $env:RAW.Trim() -replace '^v', ''
          if ($v -notmatch '^\d+\.\d+\.\d+(\.\d+)?$') {
            Write-Host "::error::Version '$($env:RAW)' is not a dotted numeric version."
            exit 1
          }
          Write-Host "Validated version: $v"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (SHA-pinned)

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.1 (SHA-pinned)
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable (SHA-pinned)

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2 (SHA-pinned)
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      # Same gates the release pipeline applies before it builds. An unsigned
      # preview is still a build that reaches users: the difference is the
      # signature, not the testing.
      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      # Reuses the audited local release script rather than repeating its steps,
      # which is what keeps the bundle/ cleanup honest: a build that half-failed
      # cannot have its leftover installer picked up as if it came from this run.
      - name: Build and collect Windows artifacts
        run: npm run release:local:skip-tests

      # Records the unsigned state instead of failing on it. DESKTOP_SIGNATURES.md
      # ships inside the artifact set and states on its face that nothing was
      # signed.
      - name: Record the unsigned signing state
        run: npm run desktop:release:signing:report -- --platform windows --dir release-local/windows

      # Fails the run if any .exe or .msi somehow reports a signature. The point of
      # this release is that nothing is signed; a signed artifact leaking in would
      # mean the release notes and the artifacts disagree.
      - name: Assert that no Windows binary is signed
        shell: pwsh
        run: |
          $signed = Get-ChildItem -Path release-local/windows -Include *.exe,*.msi -Recurse |
            Where-Object { (Get-AuthenticodeSignature $_.FullName).Status -ne 'NotSigned' }
          if ($signed) {
            $signed | ForEach-Object { Write-Host "  signed: $($_.FullName)" }
            Write-Host '::error::A binary in this release reports a signature. This workflow publishes unsigned artifacts only.'
            exit 1
          }
          Write-Host 'All Windows binaries report NotSigned, as intended.'

      - name: Verify SHA256SUMS.txt covers every Windows artifact
        shell: pwsh
        run: |
          $sums = 'release-local/windows/SHA256SUMS.txt'
          if (-not (Test-Path $sums)) { $sums = 'release-local/SHA256SUMS.txt' }
          if (-not (Test-Path $sums)) {
            Write-Host '::error::No SHA256SUMS.txt found. The release notes tell users to verify a hash; there has to be one.'
            exit 1
          }
          $text = Get-Content $sums -Raw
          $files = Get-ChildItem -Path release-local/windows -Include *.exe,*.msi -Recurse
          $missing = @()
          foreach ($f in $files) {
            $hash = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower()
            if ($text -notmatch [regex]::Escape($hash)) { $missing += $f.Name }
          }
          if ($missing.Count -gt 0) {
            $missing | ForEach-Object { Write-Host "  missing from SHA256SUMS.txt: $_" }
            Write-Host '::error::Not every Windows binary is listed in SHA256SUMS.txt.'
            exit 1
          }
          Write-Host "SHA256SUMS.txt covers all $($files.Count) Windows binary artifact(s)."

      - name: Build release notes
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          $v = $env:VERSION.Trim() -replace '^v', ''
          $warning = @"
          ## ⚠️ Windows artifacts in this release are NOT code-signed

          These files carry no Authenticode signature and have no download
          reputation. **Windows will show "Windows protected your PC" and you must
          click "More info" → "Run anyway" to run the installer.** This is expected
          and it is not a sign of malware.

          Verify the SHA-256 digest against ``SHA256SUMS.txt`` before running
          anything:

          ```
          sha256sum -c SHA256SUMS.txt
          ```

          **Why unsigned.** This project's release pipeline treats an unsigned
          desktop release as a failure rather than shipping one, so there is
          nothing to sign with yet. The project has prepared an application to the
          [SignPath Foundation](https://signpath.org) for a free open-source
          code-signing certificate; it has not been submitted yet. When signing is
          available, subsequent Windows releases will be signed and this notice
          will be removed.

          This release is marked as a **pre-release** for that reason. It is
          published so the software can be tested and so the project can meet the
          Foundation's requirement that a Windows release exists; it is not a
          stable release and ``latest`` does not point at it.

          The code signing policy, including exactly what is and is not signed, is
          published at <https://kalderashield.com/code-signing-policy.html>.

          ---

          "@@
          $notes = "$warning`n## What's in this build`n`nWindows x64 installer artifacts for v$v, built from this repository by GitHub Actions. See the repository changelog for the full list of changes."
          New-Item -ItemType Directory -Force -Path release-local/notes | Out-Null
          Set-Content -Path release-local/notes/UNSIGNED-WINDOWS-NOTICE.md -Value $notes -Encoding utf8
          Write-Host 'Release notes written.'

      - name: List artifacts to publish
        shell: pwsh
        run: |
          Get-ChildItem -Path release-local/windows -Recurse -File |
            Select-Object FullName, Length |
            Format-Table -AutoSize

      - name: Stop before publishing (dry run)
        if: ${{ inputs.dry_run }}
        shell: pwsh
        run: |
          Write-Host '::notice::dry_run is true. Everything above ran; no release was created. Re-run with dry_run=false to publish.'

      - name: Publish unsigned preview release
        if: ${{ !inputs.dry_run }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          $v = $env:VERSION.Trim() -replace '^v', ''
          $tag = "v$v-unsigned-preview"
          Write-Host "Publishing tag $tag as a pre-release."

          # Every file under release-local/windows, plus the checksum manifest,
          # whichever of the two locations the build put it in.
          $paths = @(Get-ChildItem -Path release-local/windows -Recurse -File |
            ForEach-Object { $_.FullName })

          $sums = @('release-local/windows/SHA256SUMS.txt', 'release-local/SHA256SUMS.txt') |
            Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $sums) {
            Write-Host '::error::No SHA256SUMS.txt to attach. The release notes tell users to check a hash.'
            exit 1
          }
          if ($paths -notcontains (Resolve-Path $sums).Path) {
            $paths += (Resolve-Path $sums).Path
          }

          $body = Get-Content release-local/notes/UNSIGNED-WINDOWS-NOTICE.md -Raw

          # $ghArgs, not $args. $args is an automatic variable in PowerShell and
          # assigning to it does not build the array -- the splat below would
          # expand whatever the shell happened to leave in it, and gh would be
          # called with no arguments. That failure would surface as a confusing
          # "usage:" message rather than as the reserved-word collision it is.
          $ghArgs = @(
            'release', 'create', $tag,
            '--title', "KalderaShield $v for Windows (unsigned preview)",
            '--notes', $body,
            '--prerelease',
            '--target', $env:GITHUB_SHA
          )
          foreach ($p in $paths) { $ghArgs += @($p) }

          Write-Host "Publishing $($paths.Count) asset(s)."
          gh @ghArgs
          if ($LASTEXITCODE -ne 0) { Write-Host '::error::gh release create failed.'; exit 1 }

          Write-Host "Published $tag as a pre-release."
          Write-Host 'Verify latest does not point here:'
          gh release view --json tagName,isPrerelease,isLatest -q '"  tag=\(.tagName) prerelease=\(.isPrerelease) latest=\(.isLatest)"'
