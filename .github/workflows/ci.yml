# CI â€” typecheck and unit test gates on every push and pull request
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Coverage, not test:unit -- same 253 files and 2243 tests, plus the
      # thresholds in vitest.config.ts actually enforced.
      #
      # The thresholds were configured and never run. `vitest run` alone does not
      # enable coverage, so lines 90 / statements 88 / functions 85 / branches 80
      # only applied when someone ran test:coverage by hand, which meant the
      # homepage's "90% lines" claim rested on a person remembering to look. A
      # threshold nothing enforces is a comment, not a gate.
      #
      # This replaces test:unit rather than following it: running both would
      # execute the same suite twice for one extra number. The measured figures
      # sit close to the floor on purpose -- lines 91.1 against 90, statements
      # 89.6 against 88 -- so a regression shows up as a red build instead of a
      # number nobody reads.
      - name: Unit tests with coverage thresholds enforced
        run: npm run test:coverage

      # The report is uploaded so a failing threshold can be read rather than
      # guessed at. Without it the log says which number missed and nothing
      # about which lines moved, which is the difference between fixing a
      # regression and guessing at one. Seven days matches the Scorecard SARIF
      # retention in scorecard.yml.
      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v5.0.0 (SHA-pinned)
        with:
          name: unit-coverage
          path: coverage/
          retention-days: 7

  # P1-2b. This job existed as an open finding for five weeks, and the reason is
  # the point of adding it: the suite was broken (6 of 34 passing) and nothing
  # noticed, because nothing ran it. The README claimed "34 scenarios x 3
  # browsers = 102/102" from a measurement old enough that the suite had since
  # regressed past it. Every bug fixed this session -- the reload that bricked
  # the vault, the share prompt that never rendered, both password-rotation
  # faults, the untestable secret-key promise -- was invisible to CI, because
  # CI had no e2e step.
  #
  # Chromium only. The suite is written against one browser and running all
  # three would triple the wall clock to prove a claim this job does not make;
  # cross-browser coverage belongs to a release checklist, not to a PR gate.
  # `--workers=1` for the same reason `fullyParallel: false` is already set in
  # playwright.config.ts: the vault writes to OPFS and a second tab racing the
  # first is the failure mode the config comment already describes.
  e2e-smoke:
    name: E2E smoke (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # playwright.config.ts starts `npm run build && npm run preview` itself,
      # so the job does not build separately. Measured locally at 34/34 in
      # 1.9 minutes; 20 minutes leaves room for a cold runner without turning a
      # genuine hang into an overnight wait.
      - name: Run the suite
        run: npx playwright test --project=chromium --workers=1 --reporter=line

      # Uploaded on failure as well as success. The Playwright HTML report is
      # the only place the `error-context.md` snapshot lives, and a snapshot
      # nobody can open is the same as no snapshot: the previous rounds of this
      # investigation each started by reading a saved page snapshot to find out
      # which dialog was on screen.
      - name: Upload the Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v5.0.0 (SHA-pinned)
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      # Only the failure traces. Traces are recorded on the first retry and
      # `retries: 2` under CI, so these exist exactly when something broke.
      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v5.0.0 (SHA-pinned)
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  website-gates:
    name: Website quality gates
    runs-on: ubuntu-latest
    # 25, not 10. `npx playwright install --with-deps chromium` below takes
    # ~10 minutes on a cold runner -- Chromium plus ~32MB of apt packages -- and
    # at 10 this job was killed at 10m16s before a single gate had run, so a copy
    # or i18n failure surfaced as a cancelled run with no output at all. The
    # browser is the long pole in here, not the gates: npm ci plus the fourteen
    # checks is about two minutes. Splitting the contrast audit into its own job
    # was tried to get the browser out of this budget; that job failed twice in
    # a row at "Prepare all required actions" with "Unable to resolve action
    # actions/setup-node@820762... -- unable to find version", while the other
    # jobs in the same run resolved that same SHA, so the split stayed broken
    # and the timeout stayed too low. One job with enough minutes is the state
    # that actually runs.
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      # Three of the scripts below are not dependency-free, which the previous
      # version of this job assumed:
      #   generate-locales  jsdom, to apply a dictionary to a document offline
      #   audit-contrast    playwright, to measure rendered text in three themes
      #   sync-claims       vitest, to read the real test count
      # The rest are plain Node. Installing the whole tree is the honest option:
      # the lockfile is already there and these three would otherwise fail on
      # the first line with a module-not-found that says nothing about the site.
      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for the contrast audit
        run: npx playwright install --with-deps chromium

      - name: Copy and dictionary gates
        working-directory: kalderashield-website
        run: |
          node scripts/audit-copy-drift.cjs
          node scripts/audit-home-keys.cjs
          node scripts/audit-header-nav.cjs
          node scripts/audit-page-packs.cjs
          node scripts/audit-translation-scripts.cjs
          node scripts/audit-page-meta.cjs

      # Walks the rendered pages in three theme states -- including a dark OS with
      # the toggle set to light -- and fails on any text under WCAG AA. Reading
      # the palette does not catch this: --text-faint passed on --bg and failed on
      # --bg-raised, which is where the footer headings actually sit.
      - name: Text contrast meets WCAG AA
        working-directory: kalderashield-website
        run: node scripts/audit-contrast.cjs

      # The hero title is the only heading on this site set in a system font
      # stack rather than a webfont, so which family a visitor gets is decided by
      # their operating system. It shipped at `line-height: 1.08`, which is
      # tighter than the font's own line box -- the element box was shorter than
      # the glyphs in it, overflowing 6px above and 4px below on Windows. Nothing
      # clipped, so it rendered; that was luck. One `overflow: hidden` on a
      # parent and the descenders of "Only" disappear.
      #
      # Reading the CSS cannot answer this, and neither can the contrast audit:
      # it needs a rendered box compared against the union of the text's own
      # client rects, on each family the stack can resolve to.
      - name: Hero title contains its own glyphs on every system font
        working-directory: kalderashield-website
        run: node scripts/audit-hero-metrics.cjs

      # The homepage publishes how many tests the suite has. It used to be a
      # hardcoded number in the markup and in twelve translation files, and it
      # had already drifted. This regenerates it from `vitest list` and fails if
      # the committed copy disagrees, so a new test cannot leave the site
      # claiming an old number.
      - name: Published claims match the test suite
        working-directory: kalderashield-website
        run: node scripts/sync-claims.cjs --check

      # The homepage also publishes two claims that are statements about the
      # product rather than about the repository: which KDF derives the recovery
      # key, and whether an independent audit has happened. Both had parted
      # ways with reality -- the recovery copy named PBKDF2 while
      # src/lib/recoveryKey.ts derives with Argon2id, and the audit badge said
      # "in progress" while the audit page said no audit had taken place. The
      # first is read out of the source, so changing RECOVERY_KDF_PROFILE fails
      # here instead of leaving twelve dictionaries publishing the old numbers.
      - name: Cryptographic and audit claims match the code
        working-directory: kalderashield-website
        run: node scripts/sync-security-claims.cjs --check

      # theme-color as a prefers-color-scheme pair, and the rel="sitemap" link,
      # on every page. The colours are read from site.css by the script, so a
      # palette change cannot leave the browser chrome behind it.
      - name: Head metadata matches the stylesheet
        working-directory: kalderashield-website
        run: node scripts/sync-head-meta.cjs --check

      # assets/js/i18n-apply.js has to load before site.js on every page:
      # site.js throws at start without it, so a page missing it fails in the
      # browser rather than at build time.
      - name: Translation core is loaded before the site script
        working-directory: kalderashield-website
        run: node scripts/sync-script-tags.cjs --check

      # Which locales may have their own URLs. A dictionary with a missing key
      # would otherwise publish an address whose page silently falls back to
      # English -- one indexable URL per language, most of them duplicates.
      - name: Every locale is complete enough to publish
        working-directory: kalderashield-website
        run: node scripts/measure-locale-coverage.cjs

      # Every other gate here runs dictionary-ward: "does this page say what its
      # dictionary says", "does every locale have this key". None of them look at
      # a key no page asks for, and that gap held two false claims -- a recovery
      # KDF named PBKDF2 and a testimonial asserting that independent audits
      # exist -- in all twelve dictionaries, shipped to every visitor, invisible
      # on every page. The legacy orphans are recorded in a committed baseline so
      # this fails only on new ones; the debt stops growing here and pruning it
      # stays ordinary work.
      - name: No dictionary key is left unrendered
        working-directory: kalderashield-website
        run: node scripts/audit-orphan-keys.cjs

      # Every other gate in this job reads markup that has already been checked
      # for language, dictionaries and contrast, and none of them asks whether
      # the file a <source> or <img> points at exists. That is what let the
      # homepages be published from a working tree git never saw: the 12 MB
      # promo video and its twelve subtitle tracks are still served from
      # kalderashield.com while the block referencing them sat only in a stash.
      # Nothing here would have noticed either half.
      #
      # The ignore rules in .gitignore keep those bytes out of git; this is what
      # makes them safe -- it keeps the reference from becoming a 404 that only
      # a visitor could see. 11,426 local references, currently all resolving.
      - name: Every local src and href resolves to a file in the tree
        working-directory: kalderashield-website
        run: node scripts/audit-local-assets.cjs

      # "kurulum särasında" for "sırasında". Turkish has no ä and no û, so those
      # two characters are a corrupted character rather than a word, and no
      # spellchecker flags them. Scoped to the Turkish copy because the same
      # test is 340 false positives in German.
      - name: Turkish copy has no corrupted characters
        working-directory: kalderashield-website
        run: node scripts/audit-turkish-copy.cjs

      # The committed locale pages must be what generate-locales.cjs produces
      # now. Regenerating and diffing is the check: the generator is the only
      # Every page is written in its own language at build time, so a
      # data-i18n node's text should already be the translated one. This is what
      # makes the site loadable without scripts and lets the browser fetch a
      # six-key dictionary instead of the 1378-key one.
      - name: Every page already carries its own language
        working-directory: kalderashield-website
        run: node scripts/audit-static-i18n.cjs

      # A link inside /de/ that points at /download/ drops the reader into the
      # Turkish page while the language control still shows German. Two rounds
      # of this got through before it was caught: first every root-relative link,
      # then the 188 that carry a fragment, such as /#comparison and
      # /download/#linux, which are the section and platform links people click.
      - name: Links stay inside their own language
        working-directory: kalderashield-website
        run: node scripts/audit-locale-links.cjs

      # The six-key dictionary the browser still needs, derived from the full
      # ones so the two cannot disagree.
      - name: Build the runtime dictionary
        working-directory: kalderashield-website
        run: node scripts/build-chrome-dictionary.cjs

      # The committed HTML, dictionaries, locale pages and sitemap must be
      # exactly what the generators produce.
      #
      # This is one step running all of them in order, rather than one step per
      # generator with its own diff. The generators write the same files:
      # build-pages produces the unprefixed pages, generate-locales then adds
      # their hreflang, structured data and per-language copies. Four separate
      # diff steps therefore depend on execution order -- running build-pages
      # last leaves the pages without the metadata the earlier step added, and
      # the diff reports that as drift. A single ordered run plus a single diff
      # has no such failure mode, and says which file is out of date either way.
      #
      # The order matters and is: content -> dictionaries -> markup -> per-page
      # metadata -> locales -> sitemap. Each script reads what the previous one
      # wrote.
      - name: Generated output is reproducible
        working-directory: kalderashield-website
        run: |
          node scripts/build-pages.cjs
          node scripts/add-comparison-cell-i18n.cjs
          node scripts/add-cta-i18n.cjs
          node scripts/fix-faq-path-placeholder.cjs
          node scripts/rewrite-comparison-table.cjs
          node scripts/sync-claims.cjs
          node scripts/sync-security-claims.cjs
          node scripts/sync-head-meta.cjs
          node scripts/sync-script-tags.cjs
          node scripts/generate-locales.cjs
          node scripts/generate-sitemap.cjs
          git diff --exit-code \
            || (echo "::error::generated site output is out of date; run the scripts above in kalderashield-website and commit the result" && git diff --stat && exit 1)

      # check-placeholders is deliberately not in this list: it fails while the
      # production domain does not exist yet (Faz 6), which is a documented,
      # time-boxed state rather than a regression. Add it here when the domain
      # is chosen.

  rust-tests:
    name: Rust check and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux dependencies (Tauri/WebKit)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            patchelf

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy

      - name: Cache cargo build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Cargo check
        run: cargo check --all-targets

      - name: Cargo tests
        run: cargo test

      - name: Cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Install cargo-deny (official release binary)
        run: |
          CD_VERSION=0.20.2
          curl -sSfL "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CD_VERSION}/cargo-deny-${CD_VERSION}-x86_64-unknown-linux-musl.tar.gz" -o /tmp/cargo-deny.tar.gz
          tar -xzf /tmp/cargo-deny.tar.gz -C /tmp
          sudo install -m 755 "/tmp/cargo-deny-${CD_VERSION}-x86_64-unknown-linux-musl/cargo-deny" /usr/local/bin/cargo-deny
          cargo-deny --version

      - name: Cargo deny (RustSec advisories, bans, licences, sources)
        # All four gates are release blockers. `cargo deny check advisories`
        # alone left the licence and source policies in src-tauri/deny.toml
        # unenforced, so a copyleft or unknown-origin dependency could ship
        # without any signal.
        run: cargo deny check advisories bans licenses sources

  security:
    name: Security gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: 'Security: dependencies audit'
        run: npm run security:dependencies

      - name: 'Security: CSP strict-style gate'
        run: npm run security:csp

      - name: 'Security: no JS master password string'
        run: npm run security:no-js-master-string

      # K-1 regression gate. The credential-handling Activity must stay
      # android:exported="false" and must keep resolving Autofill requests
      # through the in-process registry instead of Intent extras, which is what
      # closed the forged-intent credential exfiltration.
      #
      # The gate also used to require Android lint to be wired in, because lint
      # was never run and had seven errors waiting unnoticed — four of them NewApi
      # on this autofill path, a class extending an API 26 type while minSdk is
      # 24. Android lint is deliberately NOT in this workflow. It cannot be, and
      # the reason is worth writing down so nobody tries again:
      #
      # The app module's Kotlin does not compile until the Rust library has been
      # cross-compiled. `MainActivity : TauriActivity`, but `TauriActivity` is
      # not part of the `:tauri-android` Gradle project — it is a template at
      # `tauri-<ver>/mobile/android-codegen/TauriActivity.kt` that tauri's
      # `build.rs` copies into the app's Kotlin sources, and only when
      # `WRY_ANDROID_KOTLIN_FILES_OUT_DIR` is set, which only wry's Gradle
      # plugin does. Its own superclass is no better: `WryActivity` lives in the
      # `wry` crate, not in tauri. So a bare `./gradlew :app:lintArmDebug`
      # compiles the app against a missing base class and dies with
      # "Unresolved reference: TauriActivity" plus a ~40-error cascade.
      #
      # Lint was attempted here twice and failed for reasons that each looked
      # like the last one: first the gitignored Gradle glue
      # (`tauri.settings.gradle`, `tauri.build.gradle.kts`) was missing, then the
      # codegen. Only the release workflow has the environment this needs, and it
      # already runs `tauri android build`, which compiles all of this Kotlin —
      # so a Kotlin that does not compile is already a release blocker. The gap
      # that leaves is narrow and named: lint's NewApi findings on a tree that
      # compiles. The static gate above covers the exported-component and
      # Intent-extra halves of K-1, and the autofill service's API 26
      # requirement is asserted with `tools:targetApi`.
      - name: 'Security: Android Autofill trust boundary (K-1)'
        run: npm run security:android-autofill-boundary


      - name: 'Security: session callback authorization gate'
        run: npm run security:session-gates

      # Y-19: the release workflow must keep its blocking signing gates and
      # must keep the signing steps secret-driven and correctly ordered. This
      # catches a deleted, reordered or mis-wired signing step in ordinary CI,
      # rather than on release day.
      - name: 'Security: release signing gate (Y-19)'
        run: npm run security:release-signing

      # Y-16 / O-6: the Rust IPC boundary and the TypeScript Argon2id layer are
      # two implementations of one policy. If they drift, a parameter the desktop
      # side refuses could still be honoured by the WASM path, and nothing else
      # would notice.
      - name: 'Security: Argon2id bound parity (Y-16 / O-6)'
        run: npm run security:argon2-bounds

      # N-2 / #26: the i18n audit was never wired into CI, which is why a
      # two-language key regression (double-quoted keys are invisible to the
      # audit's single-quote key regex) stayed invisible until it was found
      # locally. Parity is a release-quality gate, not a nicety: a missing key
      # ships as a raw key string in the UI of a password manager.
      - name: 'i18n key parity audit (12 locales)'
        run: npm run i18n:audit

      - name: Fuzz tests
        run: npm run test:fuzz

      # P2-5: the audit report counted unused exports by hand and got 164,
      # which is a number nobody can maintain by reading. This runs knip plus a
      # check knip cannot do -- a module imported only by its own test looks
      # alive to knip, and that is exactly the shape the report's two "dead"
      # modules had.
      #
      # Delta-gated against scripts/dead-code-baseline.json for the same reason
      # audit-orphan-keys.cjs is: failing on today's pile would be a false
      # signal on day one. The gate fails only on dead code the baseline does
      # not already contain, so the debt stops growing rather than being paid
      # off inside an unrelated commit.
      - name: 'Dead code audit (P2-5)'
        run: npm run deadcode:audit

      # P3-8. The report assumed the build was not reproducible; measured, the
      # asset-integrity manifest already is, and this keeps it that way by
      # pinning the mechanism rather than the outcome. Runs in milliseconds, so
      # it does not spend a second vite build to prove something twice.
      - name: 'Build reproducibility (P3-8)'
        run: npm run audit:reproducibility

      - name: Gitleaks (secret scan)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
