# KalderaShield (kalderashield.com) — Production Nginx Reference Configuration
# Fixes P0.1 (unversioned immutable cache lock) and P0.6 (missing CSP & exposed server version).
#
# Install on VPS:
#   sudo cp nginx-kalderashield.com.conf /etc/nginx/sites-available/kalderashield.com
#   sudo nginx -t && sudo systemctl reload nginx

# Redirect HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name kalderashield.com www.kalderashield.com;
    server_tokens off;
    return 301 https://kalderashield.com$request_uri;
}

# Redirect www -> apex
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.kalderashield.com;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/kalderashield.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kalderashield.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://kalderashield.com$request_uri;
}

# Primary HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name kalderashield.com;

    root /var/www/kalderashield;
    index index.html;
    charset utf-8;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/kalderashield.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kalderashield.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/manifest+json
        image/svg+xml
        text/vtt;

    # Security headers (shared macro via server block; repeated inside locations that use add_header)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    # P0.6 + Phase 3: Strict static-site Content Security Policy (zero inline style="" attributes in HTML;
    # style-src 'self' blocks <style> injection while style-src-attr allows runtime JS lightbox/reveal positioning).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data:; media-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;

    # Custom 404 page
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Block internal/build directories if accidentally synced
    location ~ ^/(scripts|content|i18n-pages|i18n-packs|\.sandbox|\.git)(/|$) {
        return 404;
    }

    # P0.1: Cache strategy for static assets
    # Versioned URLs (?v=7.0.31) can be cached for 1 year immutably;
    # unversioned URLs revalidate hourly so visitors are never stuck on stale CSS/JS/images.
    location /assets/ {
        set $asset_cache "public, max-age=3600, must-revalidate";
        if ($arg_v != "") {
            set $asset_cache "public, max-age=31536000, immutable";
        }

        add_header Cache-Control $asset_cache always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        try_files $uri =404;
    }

    # HTML pages: always revalidate quickly so new releases appear immediately
    location / {
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data:; media-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
        try_files $uri $uri/ =404;
    }
}
