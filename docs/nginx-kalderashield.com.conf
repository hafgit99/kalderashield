# KalderaShield (kalderashield.com) — Production Nginx Configuration
# Fixes P0.1 (unversioned immutable cache lock) and P0.6 (missing CSP & exposed server version).
#
# TLS is terminated on this host by sslh, not nginx. From /etc/default/sslh:
#   --listen 0.0.0.0:443 --tls 127.0.0.1:8443
# Every TLS connection goes to 8443 regardless of SNI, and nginx picks a vhost by
# the SNI carried inside it. So a vhost here must listen on 8443, never on 443.
#
# Install on VPS:
#   sudo cp docs/nginx-kalderashield.com.conf /etc/nginx/sites-available/kalderashield.conf
#   sudo nginx -t && sudo systemctl reload nginx

# --- www -> apex over HTTP ---
server {
    listen 80;
    listen [::]:80;
    server_name www.kalderashield.com;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://kalderashield.com$request_uri;
    }
}

# --- www -> apex over HTTPS ---
# Needed because a client that types https://www... completes the TLS handshake
# before it can read any redirect. Without this block that handshake lands in
# catchall-8443 and the visitor sees a certificate error.
server {
    listen 8443 ssl http2;
    server_name www.kalderashield.com;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/kalderashield.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kalderashield.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    return 301 https://kalderashield.com$request_uri;
}

# --- apex over HTTP ---
# Left reachable only for the ACME challenge so certbot renews in place.
server {
    listen 80;
    listen [::]:80;
    server_name kalderashield.com;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://kalderashield.com$request_uri;
    }
}

# --- apex over HTTPS ---
server {
    listen 8443 ssl http2;
    server_name kalderashield.com;

    root /var/www/kalderashield;
    index index.html;
    charset utf-8;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/kalderashield.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kalderashield.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security headers (server-level fallback, e.g. for /404.html)
    # No HSTS preload: one-way list with 2-year lock-in.
    # COEP/CORP enable SharedArrayBuffer for the WebExtension build; the site loads no cross-origin resources.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Embedder-Policy require-corp always;
    add_header Cross-Origin-Resource-Policy same-origin always;
    # Strict static-site CSP: zero inline <script> or style="" attributes in HTML;
    # style-src-attr 'unsafe-inline' allows runtime JS lightbox/reveal positioning in site.js.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data:; media-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/manifest+json
        image/svg+xml
        text/vtt;

    # Custom 404 page
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Block internal/build directories if accidentally synced
    location ~ ^/(scripts|content|i18n-pages|i18n-packs|\.sandbox|\.git)(/|$) {
        return 404;
    }

    # P0.1: Cache strategy for static assets
    # Versioned URLs (?v=7.0.31) -> 1 year immutable;
    # unversioned URLs -> 1 hour revalidation so visitors never get stuck on stale files.
    location /assets/ {
        set $asset_cache "public, max-age=3600, must-revalidate";
        if ($arg_v != "") {
            set $asset_cache "public, max-age=31536000, immutable";
        }
        add_header Cache-Control $asset_cache always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Cross-Origin-Resource-Policy same-origin always;
        try_files $uri =404;
    }

    # HTML pages: revalidate quickly so new releases appear immediately
    location / {
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header Cross-Origin-Resource-Policy same-origin always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data:; media-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
        try_files $uri $uri/ =404;
    }
}
